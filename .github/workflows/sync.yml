name: Sync UCOS Architecture Registry

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [ucos-changed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          path: registry
      - name: Checkout UCOS implementation
        uses: actions/checkout@v4
        with:
          repository: shehrozali6465372-ctrl/universal-content-operating-system
          ref: production/master-plan-hardening
          path: ucos
      - name: Build verified layer inventory
        run: python registry/scripts/build_registry.py ucos registry
      - name: Commit registry changes
        working-directory: registry
        run: |
          git config user.name "UCOS Architecture Registry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated status
          if git diff --cached --quiet; then
            echo "Registry is synchronized."
          else
            git commit -m "chore: synchronize architecture registry"
            git push
          fi
